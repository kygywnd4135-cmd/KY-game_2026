<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>제디스4 화면 흐름</title>
    <link rel="preload" href="fonts/SUITE-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/standby.css" />
    <link rel="stylesheet" href="css/power.css" />
    <link rel="stylesheet" href="css/loading.css" />
    <link rel="stylesheet" href="css/lobby.css" />
    <link rel="stylesheet" href="css/talk.css" />
  </head>
  <body>
    <div class="viewport">
      <div class="frame">
      <main class="stage">
        <!-- ───────── 대기화면 (AOD) ───────── -->
        <section class="screen screen--standby is-active" data-screen="standby">
          <p class="clock">
            <span class="clock__date" data-clock-date>11/17 TUE</span>
            <span class="clock__time" data-clock-time>09:41</span>
          </p>

          <div class="sleeper__shadow" aria-hidden="true"></div>

          <svg class="sleeper" viewBox="0 0 282 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="꾸벅꾸벅 졸고 있는 캐릭터">
            <g class="sleeper__breath">
              <g class="sleeper__nod">
                <ellipse cx="154" cy="131" rx="128" ry="131" fill="#1871ED" />

                  <path d="M118 158.5C118 160.798 117.082 163.074 115.298 165.197C113.514 167.32 110.899 169.249 107.602 170.874C104.306 172.499 100.392 173.788 96.0853 174.668C91.7782 175.547 87.1619 176 82.5 176C77.8381 176 73.2218 175.547 68.9147 174.668C64.6077 173.788 60.6942 172.499 57.3977 170.874C54.1012 169.249 51.4863 167.32 49.7023 165.197C47.9182 163.074 47 160.798 47 158.5L82.5 158.5H118Z" fill="#1949AB" />

                </g>
              </g>
            </g>
            <!-- 발은 바닥에 붙어 있다 -->
            <ellipse cx="42.5037" cy="233.612" rx="28" ry="36.5" transform="rotate(-30.0162 42.5037 233.612)" fill="#1949AB" />
            <ellipse cx="28" cy="36.5" rx="28" ry="36.5" transform="matrix(-0.865884 -0.500244 -0.500244 0.865884 251.007 216.014)" fill="#1949AB" />
          </svg>
        </section>

        <!-- ───────── 전원 1~3 ───────── -->
        <section class="screen screen--power power" data-screen="power" data-step="1">
          <!-- 말풍선 -->
          <div class="bubble">
            <div class="bubble__pop">
              <svg class="bubble__shape" width="1049" height="359" viewBox="0 0 1049 359" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

                <path d="M44.87 308.001L0 54.698L513.371 0L1034 54.698L1010.9 264.373L649.96 340.56L44.87 308.001Z" fill="#F4F4F4" />
              </svg>
              <p class="bubble__text" data-bubble-text></p>
              <svg class="bubble__next" width="24.42" height="44.202" viewBox="974.38 206.699 24.42 44.202" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M998.8 228.8L974.38 250.901L974.38 206.699L998.8 228.8Z" fill="#1871ED" />
              </svg>
            </div>
          </div>

          <!-- 캐릭터 -->
          <div class="pc" role="img" aria-label="파란 캐릭터">
            <div class="pc__shadow">
              <div class="pc__shadow-pulse">
                <span class="pc__shadow-light"></span>
                <span class="pc__shadow-dark"></span>
              </div>
            </div>

            <div class="pc__bounce">
              <div class="pc__idle">
                <div class="pc__body"></div>

                <svg class="pc__brow" width="45" height="36" viewBox="913 704 45 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M916 737.037C917.411 723.444 927.185 700.336 955 716.647" stroke="#1949AB" stroke-width="3" />
                </svg>

                <div class="pc__eye pc__eye--l">
                  <div class="pc__eye-blink">
                    <span class="pc__white"></span>
                    <span class="pc__pupil"></span>
                  </div>
                </div>
                <div class="pc__eye pc__eye--r">
                  <div class="pc__eye-blink">
                    <span class="pc__white"></span>
                    <span class="pc__pupil"></span>
                  </div>
                </div>
              </div>
            </div>

            <div class="pc__limb pc__limb--l">
              <div class="pc__limb-idle">
                <svg width="76" height="34" viewBox="-38 -33.5 76 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M37.46 0H-37.46C-27.96 -18.177 -27.96 -28.868 2.64 -32.076C27.12 -34.642 36.06 -11.761 37.46 0Z" fill="#1949AB" />
                </svg>
              </div>
            </div>
            <div class="pc__limb pc__limb--r">
              <div class="pc__limb-idle">
                <svg width="76" height="34" viewBox="-38 -33.5 76 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M-38 0H38C28.37 -18.585 28.37 -29.517 -2.68 -32.796C-27.51 -35.42 -36.57 -12.025 -38 0Z" fill="#1949AB" />
                </svg>
              </div>
            </div>

            <!-- 느낌표 (전원 1) -->
            <div class="pc__bang">
              <svg class="pc__bang-idle" width="68.24" height="96.03" viewBox="1115.76 597 68.24 96.03" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M1183.26 607.83L1148.06 665.534L1133.09 656.954L1165.07 597.399L1183.26 607.83ZM1125.57 687.405C1122.87 685.858 1121.1 683.576 1120.26 680.559C1119.44 677.514 1119.81 674.651 1121.39 671.969C1122.89 669.282 1125.16 667.54 1128.19 666.742C1131.22 665.944 1134.08 666.319 1136.78 667.866C1139.37 669.351 1141.09 671.609 1141.96 674.642C1142.83 677.675 1142.51 680.534 1141.01 683.221C1139.95 685.004 1138.53 686.379 1136.74 687.346C1135 688.302 1133.13 688.808 1131.15 688.863C1129.17 688.891 1127.32 688.405 1125.57 687.405Z" fill="white" />
              </svg>
            </div>

            <!-- 별 (전원 3) -->
            <div class="pc__star">
              <span class="pc__spark pc__spark--1"></span>
              <span class="pc__spark pc__spark--2"></span>
              <span class="pc__spark pc__spark--3"></span>
              <span class="pc__spark pc__spark--4"></span>
              <svg class="pc__star-shape" width="98.986" height="98.986" viewBox="1112 596 98.986 98.986" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M1165.12 610.646C1167.17 608.101 1171.24 608.949 1172.09 612.1L1176.76 629.192C1177.09 630.425 1178 631.424 1179.2 631.878L1195.76 638.173C1198.81 639.334 1199.26 643.466 1196.53 645.257L1181.71 654.973C1180.64 655.674 1179.97 656.844 1179.91 658.122L1179.04 675.816C1178.88 679.078 1175.09 680.784 1172.54 678.74L1158.73 667.653C1157.73 666.853 1156.41 666.578 1155.17 666.913L1138.08 671.554C1134.93 672.41 1132.13 669.331 1133.29 666.277L1139.56 649.709C1140.02 648.513 1139.87 647.173 1139.17 646.103L1129.47 631.276C1127.68 628.543 1129.75 624.935 1133.01 625.092L1150.71 625.938C1151.98 626 1153.21 625.446 1154.01 624.45L1165.12 610.646Z" fill="white" />
              </svg>
            </div>
          </div>

          <p class="stamp" data-clock-short>11/17 Tue. 9:41</p>
        </section>

        <!-- ───────── 펜 로딩 ───────── -->
        <section class="screen screen--loading loading" data-screen="loading">
          <p class="loading__title">펜의 기록을 확인중입니다<span class="loading__dot">.</span><span class="loading__dot">.</span></p>
          <p class="loading__lead" data-loading-lead></p>
          <p class="loading__sub" data-loading-sub></p>

          <div class="runner" role="img" aria-label="총총 뛰어가는 캐릭터">
            <div class="runner__hop">
              <div class="runner__body"></div>
              <div class="runner__eye">
                <span class="runner__white"></span>
                <span class="runner__pupil"></span>
              </div>
              <div class="runner__foot runner__foot--a">
                <svg width="40.35" height="18.05" viewBox="-38 -33.5 76 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M-38 0H38C28.37 -18.585 28.37 -29.517 -2.68 -32.796C-27.51 -35.42 -36.57 -12.025 -38 0Z" fill="#1949AB" />
                </svg>
              </div>
              <div class="runner__foot runner__foot--b">
                <svg width="40.35" height="18.05" viewBox="-38 -33.5 76 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M-38 0H38C28.37 -18.585 28.37 -29.517 -2.68 -32.796C-27.51 -35.42 -36.57 -12.025 -38 0Z" fill="#1949AB" />
                </svg>
              </div>
            </div>
          </div>

          <p class="stamp" data-clock-short>11/17 Tue. 9:41</p>
        </section>

        <!-- ───────── 로비 ───────── -->
        <section class="screen screen--lobby lobby" data-screen="lobby">
          <div class="lobby__plate"></div>
          <p class="lobby__desc">가장 사용 시간이 많았던 시간은 11시 50분이네요.<br />무슨 일이 있었는지, 함께 확인하러 가볼까요?</p>
          <svg class="lobby__grid" width="1935" height="1047" viewBox="0 0 1935 1047" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>

          <!-- 캐릭터들은 js/lobby.js가 채운다 -->
          <div class="dial"></div>

          <p class="lobby__title">오늘의 기록 준비 완료!</p>

          <!-- 맨 위 눈물 모양: 위치 고정 -->
          <svg class="lobby__marker" width="62.74" height="82.9" viewBox="936 18 62.74 82.9" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M969.137 99.8916C968.15 101.232 966.144 101.223 965.17 99.874L942.502 68.4961L942.506 68.4961C938.427 63.2019 936 56.5699 936 49.3701C936 32.045 950.045 18 967.37 18C984.695 18.0001 998.74 32.0451 998.74 49.3701C998.74 56.57 996.312 63.2019 992.233 68.4961L992.237 68.4961L969.137 99.8916Z" fill="currentColor" />
          </svg>

          <div class="lobby__hint">
            <svg class="lobby__hint-icon" width="59" height="59" viewBox="1533 951 59 59" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="1533" y="951" width="59" height="59" rx="29.5" fill="#4C4C4C" />
              <path d="M1564.52 979.477H1579V982.523H1564.52V997H1561.48V982.523H1547V979.477H1561.48V965H1564.52V979.477Z" fill="#F0F0F0" />
            </svg>
            <p class="lobby__hint-text">슬라이드 / 결정</p>
          </div>

          <p class="stamp" data-clock-short>11/17 Tue. 9:41</p>
        </section>

        <!-- ───────── 대화(극장) ───────── -->
        <section class="screen screen--talk talk" data-screen="talk">
          <div class="talk__light"></div>
          <div class="talk__floor"></div>

          <!-- 배우: 수염 쓴 파랑 -->
          <div class="actor" role="img" aria-label="수염을 쓴 파란 캐릭터">
            <div class="actor__bounce">
              <div class="actor__idle">
                <svg width="1935" height="1047" viewBox="0 0 1935 1047" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M958 895H874C884.648 875.289 884.648 863.694 918.958 860.216C946.406 857.433 956.423 882.246 958 895Z" fill="#17179B" />
                  <path d="M1000 895H1086C1075.1 875.289 1075.1 863.694 1039.97 860.216C1011.87 857.433 1001.62 882.246 1000 895Z" fill="#17179B" />
                  <circle cx="983.5" cy="724.5" r="135.5" fill="#3A3AFF" />
                  <!-- 오른쪽 눈: 지그시 내리깐 눈 -->
                  <g>
                    <path d="M987.492 708.008C986.377 714.576 986.566 721.298 988.049 727.792C989.532 734.286 992.279 740.425 996.134 745.857C999.989 751.289 1004.88 755.909 1010.52 759.452C1016.16 762.996 1022.44 765.393 1029.01 766.509C1035.58 767.624 1042.3 767.434 1048.79 765.952C1055.29 764.469 1061.42 761.721 1066.86 757.866C1072.29 754.011 1076.91 749.123 1080.45 743.483C1084 737.842 1086.39 731.559 1087.51 724.992L1037.5 716.5L987.492 708.008Z" fill="white" />
                    <path d="M1003.99 710.81C1003.25 715.21 1003.37 719.714 1004.37 724.065C1005.36 728.416 1007.2 732.529 1009.78 736.169C1012.37 739.809 1015.64 742.904 1019.42 745.278C1023.2 747.652 1027.41 749.259 1031.81 750.006C1036.21 750.753 1040.72 750.626 1045.07 749.633C1049.42 748.639 1053.53 746.798 1057.17 744.215C1060.81 741.632 1063.9 738.358 1066.28 734.578C1068.65 730.799 1070.26 726.589 1071.01 722.189L1037.5 716.5L1003.99 710.81Z" fill="#191EAB" />
                  </g>
                  <!-- 왼쪽 눈: 동그랗게 뜬 눈 -->
                  <g class="actor__eye">
                    <circle cx="925.5" cy="719.5" r="45.5" fill="white" />
                    <ellipse class="actor__pupil" cx="931" cy="719.5" rx="33" ry="32.5" fill="#191EAB" />

                </svg>
              </div>
            </div>
          </div>

          <div class="bubble">
            <div class="bubble__pop">
              <svg class="bubble__shape" width="1049" height="359" viewBox="0 0 1049 359" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M58.988 326.482L14.08 73.178L527.887 18.48L1048.96 73.178L1025.84 282.854L664.59 359.04L58.988 326.482Z" fill="#6B6B6B" />
                <path d="M44.87 308.001L0 54.698L513.371 0L1034 54.698L1010.9 264.373L649.96 340.56L44.87 308.001Z" fill="#F4F4F4" />
              </svg>
              <p class="bubble__text" data-talk-text></p>
              <svg class="bubble__next" width="24.42" height="44.202" viewBox="974.38 206.699 24.42 44.202" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M998.8 228.8L974.38 250.901L974.38 206.699L998.8 228.8Z" fill="#1871ED" />
              </svg>
            </div>
          </div>

          <!-- 관객석 -->
          <div class="crowd" aria-hidden="true">
            <div class="crowd__seat" data-seat="peach" style="--x:88px;--y:1047px;--r:117px;--c:#ffd3af;--tempo:2.6s"><div class="crowd__hop"><i class="crowd__head"></i></div></div>
            <div class="crowd__seat" data-seat="mint" style="--x:365px;--y:1059px;--r:91px;--c:#c7fffa;--tempo:2.1s;--offset:-0.7s"><div class="crowd__hop"><i class="crowd__head"></i></div></div>
            <div class="crowd__seat" data-seat="green" style="--x:573.5px;--y:1075.5px;--r:74.5px;--c:#b9ffb8;--tempo:2.9s;--offset:-1.3s"><div class="crowd__hop"><i class="crowd__head"></i></div></div>
            <div class="crowd__seat" data-seat="violet" style="--x:1597px;--y:1045px;--r:105px;--c:#bea9ff;--tempo:2.3s;--offset:-0.4s"><div class="crowd__hop"><i class="crowd__head"></i></div></div>
            <div class="crowd__seat" data-seat="pink" style="--x:1871.5px;--y:1027.5px;--r:122.5px;--c:#ffacce;--tempo:2.7s;--offset:-1.8s"><div class="crowd__hop"><i class="crowd__head"></i></div></div>
          </div>

          <!-- 관객 반응: 한마디와 느낌표 (내용은 js/talk.js가 채운다) -->
          <p class="shout" data-shout="farLeft" style="transform: translate(44.85px, 829.96px) rotate(-18.08deg)"><span class="shout__pop"><span class="shout__wiggle"></span></span></p>
          <p class="shout" data-shout="left" style="transform: translate(397.22px, 878px) rotate(16.52deg)"><span class="shout__pop"><span class="shout__wiggle"></span></span></p>
          <p class="shout" data-shout="right" style="transform: translate(1393px, 938.89px) rotate(-18.08deg)"><span class="shout__pop"><span class="shout__wiggle"></span></span></p>
          <p class="shout" data-shout="farRight" style="transform: translate(1813.94px, 802px) rotate(15deg)"><span class="shout__pop"><span class="shout__wiggle"></span></span></p>

          <svg class="gasp" data-gasp="l" style="left:186px;top:853px" width="36" height="76" viewBox="186 853 36 76" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M205.801 854.167L193.886 904.02L206.518 907.404L221.16 858.282L205.801 854.167ZM194.283 927.801C196.561 928.411 198.733 928.13 200.798 926.957C202.869 925.761 204.199 924.021 204.786 921.737C205.413 919.488 205.126 917.34 203.924 915.291C202.722 913.243 200.982 911.914 198.704 911.303C196.518 910.718 194.381 911.008 192.293 912.175C190.205 913.342 188.847 915.049 188.22 917.298C187.836 918.823 187.865 920.323 188.309 921.798C188.735 923.244 189.468 924.513 190.507 925.605C191.552 926.674 192.811 927.406 194.283 927.801Z" fill="#A9A9A9" />
          </svg>
          <svg class="gasp" data-gasp="r" style="left:1721px;top:864px" width="20" height="76" viewBox="1721 864 20 76" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M1722.74 865.002L1724.41 916.231L1737.49 916.159L1738.64 864.914L1722.74 865.002ZM1731.08 939.063C1733.44 939.05 1735.46 938.205 1737.14 936.528C1738.82 934.828 1739.64 932.798 1739.61 930.44C1739.62 928.106 1738.77 926.109 1737.07 924.451C1735.37 922.793 1733.34 921.971 1730.98 921.984C1728.72 921.996 1726.74 922.841 1725.03 924.518C1723.32 926.194 1722.47 928.2 1722.46 930.535C1722.49 932.107 1722.91 933.545 1723.73 934.851C1724.52 936.133 1725.56 937.164 1726.86 937.943C1728.15 938.698 1729.55 939.071 1731.08 939.063Z" fill="#A9A9A9" />
          </svg>
        </section>

        <!-- 화면 전환용 암전 막 -->
        <div class="blackout" aria-hidden="true"></div>
      </main>
      </div>
    </div>

    <script src="js/stage.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/typewriter.js"></script>
    <script src="js/lobby.js"></script>

  </body>
