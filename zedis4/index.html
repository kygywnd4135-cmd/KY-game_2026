<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>제디스4 화면 흐름</title>
    <link rel="preload" href="fonts/SUITE-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/standby.css" />
    <link rel="stylesheet" href="css/power.css" />
    <link rel="stylesheet" href="css/loading.css" />
  </head>
  <body>
    <div class="viewport">
      <div class="frame">
      <main class="stage">
        <!-- ───────── 대기화면 (AOD) ───────── -->
        <section class="screen screen--standby is-active" data-screen="standby">
          <p class="clock">
            <span class="clock__date" data-clock-date>11/17 TUE</span>
            <span class="clock__time" data-clock-time>09:41</span>
          </p>

          <div class="sleeper__shadow" aria-hidden="true"></div>

          <svg class="sleeper" viewBox="0 0 282 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="꾸벅꾸벅 졸고 있는 캐릭터">
            <g class="sleeper__breath">
              <g class="sleeper__nod">
                <ellipse cx="154" cy="131" rx="128" ry="131" fill="#1871ED" />
                <g class="sleeper__eyes">
                  <path d="M118 158.5C118 160.798 117.082 163.074 115.298 165.197C113.514 167.32 110.899 169.249 107.602 170.874C104.306 172.499 100.392 173.788 96.0853 174.668C91.7782 175.547 87.1619 176 82.5 176C77.8381 176 73.2218 175.547 68.9147 174.668C64.6077 173.788 60.6942 172.499 57.3977 170.874C54.1012 169.249 51.4863 167.32 49.7023 165.197C47.9182 163.074 47 160.798 47 158.5L82.5 158.5H118Z" fill="#1949AB" />
                  <path d="M214 158.5C214 160.798 213.056 163.074 211.222 165.197C209.387 167.32 206.699 169.249 203.309 170.874C199.92 172.499 195.896 173.788 191.468 174.668C187.04 175.547 182.293 176 177.5 176C172.707 176 167.96 175.547 163.532 174.668C159.104 173.788 155.08 172.499 151.691 170.874C148.301 169.249 145.613 167.32 143.778 165.197C141.944 163.074 141 160.798 141 158.5L177.5 158.5H214Z" fill="#1949AB" />
                </g>
              </g>
            </g>
            <!-- 발은 바닥에 붙어 있다 -->
            <ellipse cx="42.5037" cy="233.612" rx="28" ry="36.5" transform="rotate(-30.0162 42.5037 233.612)" fill="#1949AB" />
            <ellipse cx="28" cy="36.5" rx="28" ry="36.5" transform="matrix(-0.865884 -0.500244 -0.500244 0.865884 251.007 216.014)" fill="#1949AB" />
          </svg>
        </section>

        <!-- ───────── 전원 1~3 ───────── -->
        <section class="screen screen--power power" data-screen="power" data-step="1">
          <!-- 말풍선 -->
          <div class="bubble">
            <div class="bubble__pop">
              <svg class="bubble__shape" width="1049" height="359" viewBox="0 0 1049 359" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M58.988 326.482L14.08 73.178L527.887 18.48L1048.96 73.178L1025.84 282.854L664.59 359.04L58.988 326.482Z" fill="#6B6B6B" />
                <path d="M44.87 308.001L0 54.698L513.371 0L1034 54.698L1010.9 264.373L649.96 340.56L44.87 308.001Z" fill="#F4F4F4" />
              </svg>
              <p class="bubble__text" data-bubble-text></p>
              <svg class="bubble__next" width="24.42" height="44.202" viewBox="974.38 206.699 24.42 44.202" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M998.8 228.8L974.38 250.901L974.38 206.699L998.8 228.8Z" fill="#1871ED" />
              </svg>
            </div>
          </div>

          <!-- 캐릭터 -->
          <div class="pc" role="img" aria-label="파란 캐릭터">
            <div class="pc__shadow">
              <div class="pc__shadow-pulse">
                <span class="pc__shadow-light"></span>
                <span class="pc__shadow-dark"></span>
              </div>
            </div>

            <div class="pc__bounce">
              <div class="pc__idle">
                <div class="pc__body"></div>

                <svg class="pc__brow" width="45" height="36" viewBox="913 704 45 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M916 737.037C917.411 723.444 927.185 700.336 955 716.647" stroke="#1949AB" stroke-width="3" />
                </svg>

                <div class="pc__eye pc__eye--l">
                  <div class="pc__eye-blink">
                    <span class="pc__white"></span>
                    <span class="pc__pupil"></span>
                  </div>
                </div>
                <div class="pc__eye pc__eye--r">
                  <div class="pc__eye-blink">
                    <span class="pc__white"></span>
                    <span class="pc__pupil"></span>
                  </div>
                </div>
              </div>
            </div>

            <div class="pc__limb pc__limb--l">
              <div class="pc__limb-idle">
                <svg width="76" height="34" viewBox="-38 -33.5 76 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M37.46 0H-37.46C-27.96 -18.177 -27.96 -28.868 2.64 -32.076C27.12 -34.642 36.06 -11.761 37.46 0Z" fill="#1949AB" />
                </svg>
              </div>
            </div>
            <div class="pc__limb pc__limb--r">
              <div class="pc__limb-idle">
                <svg width="76" height="34" viewBox="-38 -33.5 76 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M-38 0H38C28.37 -18.585 28.37 -29.517 -2.68 -32.796C-27.51 -35.42 -36.57 -12.025 -38 0Z" fill="#1949AB" />
                </svg>
              </div>
            </div>

            <!-- 느낌표 (전원 1) -->
            <div class="pc__bang">
              <svg class="pc__bang-idle" width="68.24" height="96.03" viewBox="1115.76 597 68.24 96.03" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M1183.26 607.83L1148.06 665.534L1133.09 656.954L1165.07 597.399L1183.26 607.83ZM1125.57 687.405C1122.87 685.858 1121.1 683.576 1120.26 680.559C1119.44 677.514 1119.81 674.651 1121.39 671.969C1122.89 669.282 1125.16 667.54 1128.19 666.742C1131.22 665.944 1134.08 666.319 1136.78 667.866C1139.37 669.351 1141.09 671.609 1141.96 674.642C1142.83 677.675 1142.51 680.534 1141.01 683.221C1139.95 685.004 1138.53 686.379 1136.74 687.346C1135 688.302 1133.13 688.808 1131.15 688.863C1129.17 688.891 1127.32 688.405 1125.57 687.405Z" fill="white" />
              </svg>
            </div>

            <!-- 별 (전원 3) -->
            <div class="pc__star">
              <span class="pc__spark pc__spark--1"></span>
              <span class="pc__spark pc__spark--2"></span>
              <span class="pc__spark pc__spark--3"></span>
              <span class="pc__spark pc__spark--4"></span>
              <svg class="pc__star-shape" width="98.986" height="98.986" viewBox="1112 596 98.986 98.986" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M1165.12 610.646C1167.17 608.101 1171.24 608.949 1172.09 612.1L1176.76 629.192C1177.09 630.425 1178 631.424 1179.2 631.878L1195.76 638.173C1198.81 639.334 1199.26 643.466 1196.53 645.257L1181.71 654.973C1180.64 655.674 1179.97 656.844 1179.91 658.122L1179.04 675.816C1178.88 679.078 1175.09 680.784 1172.54 678.74L1158.73 667.653C1157.73 666.853 1156.41 666.578 1155.17 666.913L1138.08 671.554C1134.93 672.41 1132.13 669.331 1133.29 666.277L1139.56 649.709C1140.02 648.513 1139.87 647.173 1139.17 646.103L1129.47 631.276C1127.68 628.543 1129.75 624.935 1133.01 625.092L1150.71 625.938C1151.98 626 1153.21 625.446 1154.01 624.45L1165.12 610.646Z" fill="white" />
              </svg>
            </div>
          </div>

          <p class="stamp" data-clock-short>11/17 Tue. 9:41</p>
        </section>

        <!-- ───────── 펜 로딩 ───────── -->
        <section class="screen screen--loading loading" data-screen="loading">
          <p class="loading__title">펜의 기록을 확인중입니다<span class="loading__dot">.</span><span class="loading__dot">.</span></p>
          <p class="loading__lead" data-loading-lead></p>
          <p class="loading__sub" data-loading-sub></p>

          <div class="runner" role="img" aria-label="총총 뛰어가는 캐릭터">
            <div class="runner__hop">
              <div class="runner__body"></div>
              <div class="runner__eye">
                <span class="runner__white"></span>
                <span class="runner__pupil"></span>
              </div>
              <div class="runner__foot runner__foot--a">
                <svg width="40.35" height="18.05" viewBox="-38 -33.5 76 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M-38 0H38C28.37 -18.585 28.37 -29.517 -2.68 -32.796C-27.51 -35.42 -36.57 -12.025 -38 0Z" fill="#1949AB" />
                </svg>
              </div>
              <div class="runner__foot runner__foot--b">
                <svg width="40.35" height="18.05" viewBox="-38 -33.5 76 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M-38 0H38C28.37 -18.585 28.37 -29.517 -2.68 -32.796C-27.51 -35.42 -36.57 -12.025 -38 0Z" fill="#1949AB" />
                </svg>
              </div>
            </div>
          </div>

          <p class="stamp" data-clock-short>11/17 Tue. 9:41</p>
        </section>
      </main>
      </div>
    </div>

    <script src="js/stage.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/typewriter.js"></script>
    <script src="js/flow.js"></script>
  </body>
</html>
